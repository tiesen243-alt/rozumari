name: Publish

on:
  push:
    tags:
      - '@rozumari/*@*.*.*'

# You can leverage Vercel Remote Caching with Turbo to speed up your builds
# @link https://turborepo.org/docs/core-concepts/remote-caching#remote-caching-on-vercel-builds
env:
  FORCE_COLOR: 3
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  android:
    if: contains(github.ref, '@rozumari/mobile@')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./tools/github/actions/setup

      - name: Extract Tag Name and Version
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION="${TAG_NAME##*@}"

          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          echo "APP_VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Setup EAS CLI
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          bun install -g eas-cli

          eas whoami

      - name: Build APK
        working-directory: ./apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_WEB_URL: ${{ secrets.EXPO_PUBLIC_WEB_URL }}
          EXPO_PUBLIC_TURNSTILE_KEY: ${{ secrets.EXPO_PUBLIC_TURNSTILE_KEY }}
          NODE_ENV: production
        run: |
          mkdir -p ./build

          eas build \
            --output="./build/rozumari-v${{ env.APP_VERSION }}.apk" \
            --platform android \
            --profile production \
            --non-interactive \
            --local

      - name: Upload Build Artifacts to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if compgen -G "apps/mobile/build/*" > /dev/null; then
            gh release upload "${{ env.TAG_NAME }}" \
              apps/mobile/build/rozumari-v${{ env.APP_VERSION }}.apk \
              --clobber
          else
            echo "No APK build artifact found, skipping upload."
            exit 1
          fi

  firmware:
    if: contains(github.ref, '@rozumari/firmware@')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Extract Tag Name and Version
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION="${TAG_NAME##*@}"

          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          echo "FIRMWARE_VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build python3 \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib

      - name: Clone MicroPython
        run: |
          git clone --depth 1 --recurse-submodules \
            https://github.com/micropython/micropython.git \
            /tmp/micropython

      - name: Build MicroPython cross compiler
        run: |
          make -C /tmp/micropython/mpy-cross -j$(nproc)

      - name: Copy firmware source
        run: |
          mkdir -p /tmp/micropython/ports/rp2/modules
          cp -r packages/firmware/src/. \
            /tmp/micropython/ports/rp2/modules/

      - name: Build firmware
        run: |
          make -C /tmp/micropython/ports/rp2 \
            BOARD=RPI_PICO2_W \
            FROZEN_MANIFEST="$GITHUB_WORKSPACE/packages/firmware/manifest.py" \
            -j$(nproc)

      - name: Upload Build Artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          mkdir -p packages/firmware/build

          cp /tmp/micropython/ports/rp2/build-RPI_PICO2_W/firmware.uf2 \
            packages/firmware/build/rozumari-v${{ env.FIRMWARE_VERSION }}.uf2

          gh release upload "${{ env.TAG_NAME }}" \
            packages/firmware/build/rozumari-v${{ env.FIRMWARE_VERSION }}.uf2 \
            --clobber
